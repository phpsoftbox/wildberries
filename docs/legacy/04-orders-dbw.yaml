# Compatibility only: operations absent from the 2026-09-07 snapshot. Baseline a5d424758f6efaccdfa969bd03106ba73dbe1309.
openapi: 3.0.1
info:
  title: 'Заказы DBW'
  version: ordersdbw
  description: |
    С помощью методов Заказы DBW (Доставка курьером WB) вы можете:
      - получать информацию о [сборочных заданиях](/openapi/orders-dbw#tag/Sborochnye-zadaniya-DBW), управлять статусами и отменять сборочные задания
      - получать, добавлять, редактировать и удалять [метаданные](/openapi/orders-dbw#tag/Metadannye-DBW) сборочных заданий

    <div class="description_ref">
      Узнать, как использовать методы в бизнес-кейсах, можно в <a href="https://dev.wildberries.ru/news/241">инструкции</a> по работе с <strong>заказами DBW</strong>
    </div>
  x-file-name: orders-dbw
paths:
  '/api/v3/dbw/orders/{orderId}/assemble':
    patch:
      x-readonly-method: false
      x-category: marketplace
      security:
        -
          HeaderApiKey: {  }
      tags:
        - 'Сборочные задания DBW'
      summary: 'Перевести в доставку'
      description: |
        Метод переводит [сборочное задание](/openapi/orders-dbw#tag/Sborochnye-zadaniya-DBW/paths/~1api~1v3~1dbw~1orders/get) в [статус](/openapi/orders-dbw#tag/Sborochnye-zadaniya-DBW/paths/~1api~1v3~1dbw~1orders~1status/post) `complete` — в доставке.

        <div class="description_limit">
        <a href="/openapi/api-information#tag/Vvedenie/Limity-zaprosov">Лимит запросов</a> на один аккаунт продавца для следующих методов DBW:
        <ul>
            <li>получение и обновление списка контактов</li>
            <li>получение и удаление метаданных</li>
            <li>методы сборочных заданий</li>
        </ul> 

        | Период | Лимит | Интервал | Всплеск |
        | --- | --- | --- | --- |
        | 1 мин | 300 запросов | 200 мс | 20 запросов |

        Один запрос с кодом ответа <code>409</code> учитывается как 10 запросов
        </div>
      parameters:
        -
          $ref: '#/components/parameters/Order'
      responses:
        204:
          description: Подтверждено
        400:
          description: 'Неправильный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                IncorrectParameter:
                  $ref: '#/components/examples/IncorrectParameter'
        401:
          $ref: '#/components/responses/401'
        402:
          $ref: '#/components/responses/402'
        403:
          $ref: '#/components/responses/AccessDenied'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          description: 'Ошибка обновления статуса'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                StatusMismatch:
                  $ref: '#/components/examples/StatusMismatch'
        429:
          $ref: '#/components/responses/429'
  '/api/v3/dbw/orders/{orderId}/meta':
    get:
      x-readonly-method: true
      x-category: marketplace
      security:
        -
          HeaderApiKey: {  }
      tags:
        - 'Метаданные DBW'
      summary: 'Получить метаданные сборочного задания'
      description: |
        Метод возвращает метаданные [сборочного задания](/openapi/orders-dbw#tag/Sborochnye-zadaniya-DBW/paths/~1api~1v3~1dbw~1orders/get).
        <br><br>
        Перечень метаданных, доступных для сборочного задания, можно получить в [списке новых сборочных заданий](/openapi/orders-dbw#tag/Sborochnye-zadaniya-DBW/paths/~1api~1v3~1dbw~1orders~1new/get), поле `requiredMeta`.
        <br><br>
        Возможные метаданные:
          - `imei` — [IMEI](/openapi/orders-dbw#tag/Metadannye-DBW/paths/~1api~1v3~1dbw~1orders~1%7BorderId%7D~1meta~1imei/put)
          - `uin` — [УИН](/openapi/orders-dbw#tag/Metadannye-DBW/paths/~1api~1v3~1dbw~1orders~1%7BorderId%7D~1meta~1uin/put)
          - `gtin` — [GTIN](/openapi/orders-dbw#tag/Metadannye-DBW/paths/~1api~1v3~1dbw~1orders~1%7BorderId%7D~1meta~1gtin/put)
          - `sgtin` — [код маркировки](/openapi/orders-dbw#tag/Metadannye-DBW/paths/~1api~1v3~1dbw~1orders~1%7BorderId%7D~1meta~1sgtin/put)

        <div class="description_limit">
        <a href="/openapi/api-information#tag/Vvedenie/Limity-zaprosov">Лимит запросов</a> на один аккаунт продавца для следующих методов DBW:
        <ul>
            <li>получение и обновление списка контактов</li>
            <li>получение и удаление метаданных</li>
            <li>методы сборочных заданий</li>
        </ul> 

        | Период | Лимит | Интервал | Всплеск |
        | --- | --- | --- | --- |
        | 1 мин | 300 запросов | 200 мс | 20 запросов |

        </div>
      parameters:
        -
          $ref: '#/components/parameters/Order'
      responses:
        200:
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                nullable: false
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
        400:
          description: 'Неправильный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                IncorrectParameter:
                  $ref: '#/components/examples/IncorrectParameter'
        401:
          $ref: '#/components/responses/401'
        402:
          $ref: '#/components/responses/402'
        403:
          $ref: '#/components/responses/AccessDenied'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/429'
    delete:
      x-readonly-method: false
      x-category: marketplace
      security:
        -
          HeaderApiKey: {  }
      tags:
        - 'Метаданные DBW'
      summary: 'Удалить метаданные сборочного задания'
      description: |
        Метод удаляет значение [метаданных сборочного задания](/openapi/orders-dbw#tag/Metadannye-DBW/paths/~1api~1v3~1dbw~1orders~1%7BorderId%7D~1meta/get) для переданного ключа.
        <br><br>
        Возможные метаданные:
          - `imei` — [IMEI](/openapi/orders-dbw#tag/Metadannye-DBW/paths/~1api~1v3~1dbw~1orders~1%7BorderId%7D~1meta~1imei/put)
          - `uin` — [УИН](/openapi/orders-dbw#tag/Metadannye-DBW/paths/~1api~1v3~1dbw~1orders~1%7BorderId%7D~1meta~1uin/put)
          - `gtin` — [GTIN](/openapi/orders-dbw#tag/Metadannye-DBW/paths/~1api~1v3~1dbw~1orders~1%7BorderId%7D~1meta~1gtin/put)
          - `sgtin` — [код маркировки](/openapi/orders-dbw#tag/Metadannye-DBW/paths/~1api~1v3~1dbw~1orders~1%7BorderId%7D~1meta~1sgtin/put)

        Можно передать только один ключ.

        <div class="description_limit">
        <a href="/openapi/api-information#tag/Vvedenie/Limity-zaprosov">Лимит запросов</a> на один аккаунт продавца для следующих методов DBW:
        <ul>
            <li>получение и обновление списка контактов</li>
            <li>получение и удаление метаданных</li>
            <li>методы сборочных заданий</li>
        </ul> 


        | Период | Лимит | Интервал | Всплеск |
        | --- | --- | --- | --- |
        | 1 мин | 300 запросов | 200 мс | 20 запросов |

        Один запрос с кодом ответа <code>409</code> учитывается как 10 запросов
        </div>
      parameters:
        -
          $ref: '#/components/parameters/Order'
        -
          name: key
          in: query
          schema:
            type: string
          description: 'Название метаданных для удаления (`imei`, `uin`, `gtin`, `sgtin`). Передается только одно значение'
      responses:
        204:
          description: Удалено
        400:
          description: 'Неправильный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                IncorrectParameter:
                  $ref: '#/components/examples/IncorrectParameter'
                IncorrectRequest:
                  $ref: '#/components/examples/IncorrectRequest'
        401:
          $ref: '#/components/responses/401'
        402:
          $ref: '#/components/responses/402'
        403:
          $ref: '#/components/responses/AccessDenied'
        409:
          description: 'Ошибка удаления метаданных'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                FailedToUpdateMeta:
                  $ref: '#/components/examples/FailedToUpdateMeta'
        429:
          $ref: '#/components/responses/429'
  '/api/v3/dbw/orders/{orderId}/meta/sgtin':
    put:
      x-readonly-method: false
      x-category: marketplace
      security:
        -
          HeaderApiKey: {  }
      tags:
        - 'Метаданные DBW'
      summary: 'Закрепить за сборочным заданием код маркировки товара'
      description: |
        Метод позволяет закрепить за сборочным заданием код маркировки [Честный знак](https://честныйзнак.рф).
        <br><br>
        Закрепить код маркировки можно только если в [метаданных сборочного задания](/openapi/orders-dbw#tag/Metadannye-DBW/paths/~1api~1v3~1dbw~1orders~1%7BorderId%7D~1meta/get) есть поле `sgtin`, а сборочное задание находится в [статусе](/openapi/orders-dbw#tag/Sborochnye-zadaniya-DBW/paths/~1api~1v3~1dbw~1orders~1status/post) `confirm`.
        <br><br>
        Получить загруженные маркировки можно в [метаданных сборочного задания](/openapi/orders-dbw#tag/Metadannye-DBW/paths/~1api~1v3~1dbw~1orders~1%7BorderId%7D~1meta/get).

        <div class="description_limit">
        <a href="/openapi/api-information#tag/Vvedenie/Limity-zaprosov">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>закрепления метаданных</strong> модели <strong>DBW</strong>:

        | Период | Лимит | Интервал | Всплеск |
        | --- | --- | --- | --- |
        | 1 мин | 1000 запросов | 60 мс | 20 запросов |

        Один запрос с кодом ответа <code>409</code> учитывается как 10 запросов
        </div>
      parameters:
        -
          $ref: '#/components/parameters/Order'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sgtins:
                  type: array
                  description: 'Массив кодов маркировки. Допускается от 16 до 135 символов для кода одной маркировки'
                  minItems: 1
                  maxItems: 24
                  items:
                    type: string
                    description: 'Код маркировки на упаковке. От 16 до 135 символов'
                    example: '1234567890123456'
      responses:
        204:
          description: Отправлено
        400:
          description: 'Неправильный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                IncorrectRequestBody:
                  $ref: '#/components/examples/IncorrectRequestBody'
                IncorrectRequest:
                  $ref: '#/components/examples/IncorrectRequest'
                IncorrectParameter:
                  $ref: '#/components/examples/IncorrectParameter'
        401:
          $ref: '#/components/responses/401'
        402:
          $ref: '#/components/responses/402'
        403:
          $ref: '#/components/responses/AccessDenied'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          description: 'Ошибка добавления маркировки'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                FailedToUpdateMeta:
                  $ref: '#/components/examples/FailedToUpdateMeta'
        429:
          $ref: '#/components/responses/429'
components:
  parameters:
    Order:
      name: orderId
      in: path
      required: true
      description: 'ID сборочного задания'
      schema:
        type: integer
        format: int64
        example: 5632423
  schemas:
    Error:
      type: object
      nullable: false
      properties:
        code:
          type: string
          description: 'Код ошибки'
          nullable: false
        message:
          type: string
          description: 'Описание ошибки'
          nullable: false
        data:
          type: object
          description: 'Дополнительные данные ошибки'
          nullable: true
    Meta:
      type: object
      description: 'Метаданные сборочного задания'
      nullable: true
      properties:
        imei:
          type: object
          properties:
            value:
              nullable: true
              type: string
              example: '123456789012345'
          description: IMEI
        uin:
          type: object
          properties:
            value:
              nullable: true
              type: string
              example: '123456789012345'
          description: УИН
        gtin:
          type: object
          properties:
            value:
              nullable: true
              type: string
              example: '123456789012345'
          description: GTIN
        sgtin:
          type: object
          properties:
            value:
              type: array
              items:
                type: string
              example:
                - '123456789012345'
              nullable: true
          description: 'Код маркировки Честного знака'
  examples:
    IncorrectParameter:
      value:
        code: IncorrectParameter
        message: ''
    StatusMismatch:
      value:
        data: {  }
        code: StatusMismatch
        message: ''
    IncorrectRequest:
      value:
        code: IncorrectRequest
        message: ''
    FailedToUpdateMeta:
      value:
        code: FailedToUpdateMeta
        message: ''
    IncorrectRequestBody:
      description: 'Некорректное тело запроса'
      value:
        code: IncorrectRequestBody
        message: ''
  responses:
    401:
      description: 'Не авторизован'
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              title:
                type: string
                description: 'Заголовок ошибки'
              detail:
                type: string
                description: 'Детали ошибки'
              code:
                type: string
                description: 'Внутренний код ошибки'
              requestId:
                type: string
                description: 'Уникальный ID запроса'
              origin:
                type: string
                description: 'ID внутреннего сервиса WB'
              status:
                type: number
                description: 'HTTP статус-код'
              statusText:
                type: string
                description: 'Расшифровка HTTP статус-кода'
              timestamp:
                type: string
                format: date-time
                description: 'Дата и время запроса'
          example:
            title: unauthorized
            detail: 'token problem; token is malformed: could not base64 decode signature: illegal base64 data at input byte 84'
            code: '07e4668e--a53a3d31f8b0-[UK-oWaVDUqNrKG]; 03bce=277; 84bd353bf-75'
            requestId: 7b80742415072fe8b6b7f7761f1d1211
            origin: s2s-api-auth-catalog
            status: 401
            statusText: Unauthorized
            timestamp: '2024-09-30T06:52:38Z'
    402:
      description: 'Требуется платёж'
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              title:
                type: string
                description: 'Заголовок ошибки'
              detail:
                type: string
                description: 'Детали ошибки. Ошибка означает, что на балансе сервиса из [Каталога](https://dev.wildberries.ru/business-solutions) недостаточно средств'
          example:
            title: 'payment required'
            detail: 'please top up your balance in your company personal account https://dev.{{ .baseDomain }}/company'
    AccessDenied:
      description: 'Доступ запрещён'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AccessDenied
            message: ''
    NotFound:
      description: 'Не найдено'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NotFound
            message: ''
    429:
      description: 'Слишком много запросов'
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              title:
                type: string
                description: 'Заголовок ошибки'
              detail:
                type: string
                description: 'Детали ошибки'
              code:
                type: string
                description: 'Внутренний код ошибки'
              requestId:
                type: string
                description: 'Уникальный ID запроса'
              origin:
                type: string
                description: 'ID внутреннего сервиса WB'
              status:
                type: number
                description: 'HTTP статус-код'
              statusText:
                type: string
                description: 'Расшифровка HTTP статус-кода'
              timestamp:
                type: string
                format: date-time
                description: 'Дата и время запроса'
          example:
            title: 'too many requests'
            detail: 'limited by c122a060-a7fb-4bb4-abb0-32fd4e18d489'
            code: '07e4668e-ac2242c5c8c5-[UK-4dx7JUdskGZ]'
            requestId: 9d3c02cc698f8b041c661a7c28bed293
            origin: s2s-api-auth-catalog
            status: 429
            statusText: 'Too Many Requests'
            timestamp: '2024-09-30T06:52:38Z'
