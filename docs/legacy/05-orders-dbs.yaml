                  $ref: '#/components/examples/IncorrectRequest'
                IncorrectParameter:
                  $ref: '#/components/examples/IncorrectParameter'
        401:
          $ref: '#/components/responses/401'
        402:
          $ref: '#/components/responses/402'
        403:
          $ref: '#/components/responses/AccessDenied'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          description: 'Ошибка добавления маркировки.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                FailedToUpdateMeta:
                  $ref: '#/components/examples/FailedToUpdateMeta'
        429:
          $ref: '#/components/responses/429'
components:
  schemas:
    Error:
      type: object
      nullable: false
      properties:
        code:
          type: string
          description: 'Код ошибки'
          nullable: false
        message:
          type: string
          description: 'Описание ошибки'
          nullable: false
        data:
          type: object
          description: 'Дополнительные данные ошибки'
          nullable: true
    Code:
      properties:
        code:
          type: string
          description: 'Код подтверждения. <br> Отображается у покупателя на сайте и в приложении Wildberries'
      type: object
      example:
        code: '123456'
    api.OrdersRequestV2:
      type: object
      properties:
        ordersIds:
          description: 'Список ID сборочных заданий'
          example:
            - 123456
            - 234567
          maxItems: 1000
          type: array
          items:
            type: integer
    api.OrdersMetaResponse:
      type: object
      properties:
        meta:
          type: array
          description: 'Метаданные сборочных заданий'
          items:
            $ref: '#/components/schemas/api.OrderMetaV2'
    api.OrderMetaV2:
      type: object
      properties:
        error:
          type: string
          description: |
            Сообщение об ошибке. <br>
            Если `error: not found`, сборочное задание не найдено
          example: ''
        gtin:
          type: string
          description: GTIN
          example: '123456789012345'
        imei:
          type: string
          description: IMEI
          example: '123456789012345'
        orderId:
          type: integer
          description: 'ID сборочного задания'
          example: 654321
        sgtin:
          type: array
          description: 'Код маркировки Честного знака'
          items:
            type: string
            example: '123456789012345'
        uin:
          type: string
          description: УИН
          example: '123456789012345'
        customsDeclaration:
          type: object
          properties:
            value:
              type: string
              example: 10704010/010624/0000302
              nullable: true
          description: 'Номер грузовой таможенной декларации'
    api.BatchError:
      properties:
        detail:
          type: object
          description: 'Детали ошибки'
          example: {  }
        origin:
          type: string
          description: 'ID внутреннего сервиса WB'
          example: dbs-public-api
        requestId:
          type: string
          description: 'Уникальный ID запроса'
          example: f1787bd2d1fdс35d6f537316514у4a05
        title:
          type: string
          description: 'Заголовок ошибки'
          example: IncorrectRequest
      type: object
    Meta:
      type: object
      description: 'Метаданные сборочного задания'
      nullable: true
      properties:
        imei:
          type: object
          properties:
            value:
              nullable: true
              type: string
              example: '123456789012345'
          description: IMEI
        uin:
          type: object
          properties:
            value:
              nullable: true
              type: string
              example: '123456789012345'
          description: УИН
        gtin:
          type: object
          properties:
            value:
              nullable: true
              type: string
              example: '123456789012345'
          description: GTIN
        sgtin:
          type: object
          properties:
            value:
              type: array
              items:
                type: string
              example:
                - '123456789012345'
              nullable: true
          description: 'Код маркировки Честного знака'
        customsDeclaration:
          type: object
          properties:
            value:
              type: string
              example: 10704010/010624/0000302
              nullable: true
          description: 'Номер грузовой таможенной декларации'
  examples:
    IncorrectParameter:
      value:
        code: IncorrectParameter
        message: 'Передан некорректный параметр'
    IncorrectRequestBody:
      description: 'Некорректное тело запроса'
      value:
        code: IncorrectRequestBody
        message: 'Некорректное тело запроса'
    IncorrectRequest:
      value:
        code: IncorrectRequest
        message: 'Переданы некорректные данные'
    StatusMismatch:
      value:
        code: StatusMismatch
        message: 'Несоответствие статусов, проверьте их правильность'
    InvalidWBCode:
      description: 'Код недействителен'
      value:
        code: InvalidWBCode
        message: ''
    SGTINIsNotFilled:
      description: 'Обязательный [код маркировки](./orders-dbs#tag/Metadannye-DBS/paths/~1api~1marketplace~1v3~1dbs~1orders~1meta~1sgtin/post) не указан'
      value:
        code: SGTINIsNotFilled
        message: ''
    FailedToUpdateMeta:
      value:
        code: FailedToUpdateMeta
        message: 'Не удалось обновить метаданные сборочного задания. Убедитесь, что сборочное задание удовлетворяет всем необходимым требованиям (сборочное задание существует, находится в статусе "На сборке", сборочному заданию доступны метаданные см. описание метода **Получить метаданные сборочного задания**)'
  responses:
    401:
      description: 'Не авторизован'
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              title:
                type: string
                description: 'Заголовок ошибки'
              detail:
                type: string
                description: 'Детали ошибки'
              code:
                type: string
                description: 'Внутренний код ошибки'
              requestId:
                type: string
                description: 'Уникальный ID запроса'
              origin:
                type: string
                description: 'ID внутреннего сервиса WB'
              status:
                type: number
                description: 'HTTP статус-код'
              statusText:
                type: string
                description: 'Расшифровка HTTP статус-кода'
              timestamp:
                type: string
                format: date-time
                description: 'Дата и время запроса'
          example:
            title: unauthorized
            detail: 'token problem; token is malformed: could not base64 decode signature: illegal base64 data at input byte 84'
            code: '07e4668e--a53a3d31f8b0-[UK-oWaVDUqNrKG]; 03bce=277; 84bd353bf-75'
            requestId: 7b80742415072fe8b6b7f7761f1d1211
            origin: s2s-api-auth-catalog
            status: 401
            statusText: Unauthorized
            timestamp: '2024-09-30T06:52:38Z'
    402:
      description: 'Требуется платёж'
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              title:
                type: string
                description: 'Заголовок ошибки'
              detail:
                type: string
                description: 'Детали ошибки. Ошибка означает, что на балансе сервиса из [Каталога](https://dev.wildberries.ru/business-solutions) недостаточно средств'
          example:
            title: 'payment required'
            detail: 'please top up your balance in your company personal account https://dev.{{ .baseDomain }}/company'
    AccessDenied:
      description: 'Доступ запрещён'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AccessDenied
            message: ''
    429:
      description: 'Слишком много запросов'
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              title:
                type: string
                description: 'Заголовок ошибки'
              detail:
                type: string
                description: 'Детали ошибки'
              code:
                type: string
                description: 'Внутренний код ошибки'
              requestId:
                type: string
                description: 'Уникальный ID запроса'
              origin:
                type: string
                description: 'ID внутреннего сервиса WB'
              status:
                type: number
                description: 'HTTP статус-код'
              statusText:
                type: string
                description: 'Расшифровка HTTP статус-кода'
              timestamp:
                type: string
                format: date-time
                description: 'Дата и время запроса'
          example:
            title: 'too many requests'
            detail: 'limited by c122a060-a7fb-4bb4-abb0-32fd4e18d489'
            code: '07e4668e-ac2242c5c8c5-[UK-4dx7JUdskGZ]'
            requestId: 9d3c02cc698f8b041c661a7c28bed293
            origin: s2s-api-auth-catalog
            status: 429
            statusText: 'Too Many Requests'
            timestamp: '2024-09-30T06:52:38Z'
    NotFound:
      description: 'Не найдено'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NotFound
            message: ''
  parameters:
    Order:
      name: orderId
      in: path
      required: true
      description: 'ID сборочного задания'
      schema:
        type: integer
        format: int64
        example: 5632423
    OrderDBS:
      name: orderId
      in: path
      required: true
      description: 'ID сборочного задания'
      schema:
        type: integer
        format: int64
        example: 5632423
