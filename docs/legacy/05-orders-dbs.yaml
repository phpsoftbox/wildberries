  version: order
  description: |
    <div class="description_important">
      Узнать больше о заказах DBS можно в <a href="https://seller.wildberries.ru/instructions/category/6572e024-7428-4db1-86a8-a4c7dbebbfcf?goBackOption=prevRoute&categoryId=5a8e1202-0865-45b7-acae-5d0afc7add56">справочном центре</a>
    </div>

    Управление [сборочными заданиями](/openapi/orders-dbs#tag/Sborochnye-zadaniya-DBS) и [метаданными](/openapi/orders-dbs#tag/Metadannye-DBS) заказов DBS (Delivery by Seller).
  x-file-name: orders-dbs
paths:
  /api/v3/dbs/orders/status:
    post:
      x-readonly-method: true
      x-category: marketplace
      security:
        -
          HeaderApiKey: {  }
      tags:
        - 'Сборочные задания DBS'
      summary: 'Получить статусы сборочных заданий'
      deprecated: true
      description: |
        Данный метод устарел. Он будет удалён [13 апреля](https://dev.wildberries.ru/release-notes?id=378)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - orders
              properties:
                orders:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  description: 'Список ID сборочных заданий'
                  items:
                    type: integer
                    format: int64
                    example: 5632423
      responses:
        200:
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    nullable: false
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                          nullable: false
                          description: 'ID сборочного задания'
                          example: 5632423
                        supplierStatus:
                          type: string
                          nullable: false
                          description: 'Статус сборочного задания, установленный продавцом'
                          example: new
                        wbStatus:
                          type: string
                          nullable: false
                          description: 'Статус сборочного задания в системе Wildberries'
        400:
          description: 'Неправильный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                IncorrectParameter:
                  $ref: '#/components/examples/IncorrectParameter'
                IncorrectRequestBody:
                  $ref: '#/components/examples/IncorrectRequestBody'
                IncorrectRequest:
                  $ref: '#/components/examples/IncorrectRequest'
        401:
          $ref: '#/components/responses/401'
        402:
          $ref: '#/components/responses/402'
        403:
          $ref: '#/components/responses/AccessDenied'
        429:
