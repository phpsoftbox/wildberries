# Compatibility only: operations absent from the 2026-09-07 snapshot. Baseline a5d424758f6efaccdfa969bd03106ba73dbe1309.
openapi: 3.0.1
info:
  title: Отчёты
  version: reports
  description: |
    <div class="description_important">
      Узнать больше об отчётах можно в <a href="https://seller.wildberries.ru/instructions/subcategory/5f2162c5-069b-416d-a4e1-48da2a76e6b0">справочном центре</a>
    </div>

    С помощью этих методов вы можете получать [основные отчёты](/openapi/reports#tag/Osnovnye-otchyoty) и отчёты о:
      1. [Остатках на складах](/openapi/reports#tag/Otchyot-ob-ostatkah-na-skladah)
      2. [Товарах с обязательной маркировкой](/openapi/reports#tag/Otchyot-o-tovarah-c-obyazatelnoj-markirovkoj)
      3. [Удержаниях](/openapi/reports#tag/Otchyoty-ob-uderzhaniyah)
      4. [Операциях при приёмке](/openapi/reports#tag/Operacii-pri-priyomke)
      5. [Платном хранении](/openapi/reports#tag/Platnoe-hranenie)
      6. [Продажах по регионам](/openapi/reports#tag/Prodazhi-po-regionam)
      7. [Доле бренда в продажах](/openapi/reports#tag/Dolya-brenda-v-prodazhah)
      8. [Скрытых товарах](/openapi/reports#tag/Skrytye-tovary)
      9. [Возвратах и перемещении товаров](/openapi/reports#tag/Otchyot-o-vozvratah-i-peremeshenii-tovarov)
  x-file-name: reports
paths:
  /api/v1/supplier/stocks:
    get:
      x-readonly-method: true
      x-category: statistics
      security:
        -
          HeaderApiKey: {  }
      summary: Склады
      deprecated: true
      description: |
        Данный метод устарел. Он будет удалён [23 июня](https://dev.wildberries.ru/release-notes?id=494)

        <div class="description_limit">
          <a href="/openapi/api-information#tag/Vvedenie/Limity-zaprosov">Лимит запросов</a> на один аккаунт продавца:

          | Период | Лимит | Интервал | Всплеск |
          | --- | --- | --- | --- |
          | 1 минута | 1 запрос | 1 минута | 1 запрос |
        </div>
      tags:
        - 'Основные отчёты'
      parameters:
        -
          name: dateFrom
          in: query
          schema:
            type: string
            format: date-time
          required: true
          description: |
            Дата и время последнего изменения по товару. <br>
            Для получения полного остатка следует указывать максимально раннее значение. <br>
            Например, `2019-06-20` <br>
            Дата в формате RFC3339. Можно передать дату или дату со временем.
            Время можно указывать с точностью до [секунд](./api-information#tag/Vvedenie/Limity-zaprosov) или миллисекунд. <br>
            Время передаётся в часовом поясе Москва (UTC+3).
            <br>Примеры:
              - `2019-06-20`
              - `2019-06-20T23:59:59`
              - `2019-06-20T00:00:00.12345`
              - `2017-03-25T00:00:00`
      responses:
        200:
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StocksItem'
              example:
                -
                  lastChangeDate: '2023-07-05T11:13:35'
                  warehouseName: Краснодар
                  supplierArticle: '443284'
                  nmId: 1439871458
                  barcode: '2037401340280'
                  quantity: 33
                  inWayToClient: 1
                  inWayFromClient: 0
                  quantityFull: 34
                  category: 'Посуда и инвентарь'
                  subject: 'Формы для запекания'
                  brand: X
                  techSize: '0'
                  Price: 185
                  Discount: 0
                  isSupply: true
                  isRealization: false
                  SCCode: Tech
        400:
          description: 'Неправильный запрос'
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/responseErrorStatistics'
                  -
                    $ref: '#/components/schemas/responseErrorStatistics2'
              examples:
                DateFromFieldRequired:
                  $ref: '#/components/examples/DateFromFieldRequired'
                DateFromValueNotValidated:
                  $ref: '#/components/examples/DateFromValueNotValidated'
        401:
          $ref: '#/components/responses/401'
        402:
          $ref: '#/components/responses/402'
        429:
          $ref: '#/components/responses/429'
  /api/v1/analytics/banned-products/shadowed:
    get:
      x-readonly-method: true
      x-category: contentanalytics
      security:
        -
          HeaderApiKey: {  }
      tags:
        - 'Скрытые товары'
      summary: 'Скрытые из каталога'
      description: |
        Метод возвращает список [товаров продавца, скрытых из каталога](https://seller.wildberries.ru/analytics-reports/banned-products/shadowed).

        <div class="description_limit">
        <a href="/openapi/api-information#tag/Vvedenie/Limity-zaprosov">Лимит запросов</a> на один аккаунт продавца:

        | Период | Лимит | Интервал | Всплеск |
        | --- | --- | --- | --- |
        | 10 сек | 1 запрос | 10 сек | 6 запросов |
        </div>
      parameters:
        -
          in: query
          name: sort
          schema:
            type: string
            enum:
              - brand
              - nmId
              - title
              - vendorCode
              - nmRating
            example: title
          description: |
            Сортировка
            - `brand` — по бренду
            - `nmId` — по артикулу WB
            - `title` — по наименованию товара
            - `vendorCode` — по артикулу продавца
            - `nmRating` — по рейтингу товара
          required: true
        -
          in: query
          name: order
          schema:
            type: string
            enum:
              - desc
              - asc
            example: desc
          description: |
            Порядок выдачи
            - `desc` — от наибольшего числового значения к наименьшему, от последнего по алфавиту значения к первому
            - `asc` — от наименьшего числового значения к наибольшему, от первого по алфавиту значения к последнему
          required: true
      responses:
        200:
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  report:
                    description: Отчёт
                    type: array
                    items:
                      type: object
                      properties:
                        brand:
                          type: string
                          example: Трикотаж
                          description: Бренд
                        nmId:
                          type: integer
                          example: 166658151
                          description: 'Артикул WB'
                        title:
                          type: string
                          example: ВАЗ
                          description: 'Наименование товара'
                        vendorCode:
                          type: string
                          example: DP02/черный
                          description: 'Артикул продавца'
                        nmRating:
                          type: number
                          example: 3.1
                          description: 'Рейтинг товара'
        400:
          description: 'Неправильный запрос'
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                    description: 'Заголовок ошибки'
                  status:
                    type: number
                    description: 'HTTP статус-код'
                  detail:
                    type: string
                    description: 'Детали ошибки'
                  requestId:
                    type: string
                    description: 'Уникальный ID запроса'
                  origin:
                    type: string
                    description: 'ID внутреннего сервиса WB'
              example:
                title: 'bad request'
                status: 400
                detail: 'missing order'
                requestId: 064f6c9e-924e-4e13-b551-0b89e3077938
                origin: banreportsvc-api
        401:
          $ref: '#/components/responses/401'
        402:
          $ref: '#/components/responses/402'
        429:
          $ref: '#/components/responses/429'
components:
  schemas:
    StocksItem:
      type: object
      properties:
        lastChangeDate:
          type: string
          description: 'Дата и время обновления информации в сервисе. Это поле соответствует параметру `dateFrom` в запросе. Если часовой пояс не указан, то берётся Московское время (UTC+3)'
        warehouseName:
          type: string
          maxLength: 50
          description: 'Название склада'
        supplierArticle:
          type: string
          maxLength: 75
          description: 'Артикул продавца'
        nmId:
          type: integer
          description: 'Артикул WB'
        barcode:
          type: string
          maxLength: 30
          description: Баркод
        quantity:
          type: integer
          description: 'Количество, доступное для продажи (сколько можно добавить в корзину)'
        inWayToClient:
          type: integer
          description: 'В пути к клиенту'
        inWayFromClient:
          type: integer
          description: 'В пути от клиента'
        quantityFull:
          type: integer
          description: 'Полное (непроданное) количество, которое числится за складом (= `quantity` + в пути)'
        category:
          type: string
          maxLength: 50
          description: Категория
        subject:
          type: string
          maxLength: 50
          description: Предмет
        brand:
          type: string
          maxLength: 50
          description: Бренд
        techSize:
          type: string
          maxLength: 30
          description: Размер
        Price:
          type: number
          description: Цена
        Discount:
          type: number
          description: Скидка
        isSupply:
          type: boolean
          description: 'Договор поставки (внутренние технологические данные)'
        isRealization:
          type: boolean
          description: 'Договор реализации (внутренние технологические данные)'
        SCCode:
          type: string
          maxLength: 50
          description: 'Код контракта (внутренние технологические данные)'
    responseErrorStatistics:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
    responseErrorStatistics2:
      type: object
      properties:
        errors:
          type: string
  examples:
    DateFromFieldRequired:
      description: 'Ошибка в запросе'
      value:
        errors:
          - 'dateFrom: field required'
    DateFromValueNotValidated:
      description: 'Ошибка в запросе'
      value:
        errors: 'dateFrom: Value not validated'
  responses:
    401:
      description: 'Не авторизован'
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              title:
                type: string
                description: 'Заголовок ошибки'
              detail:
                type: string
                description: 'Детали ошибки'
              code:
                type: string
                description: 'Внутренний код ошибки'
              requestId:
                type: string
                description: 'Уникальный ID запроса'
              origin:
                type: string
                description: 'ID внутреннего сервиса WB'
              status:
                type: number
                description: 'HTTP статус-код'
              statusText:
                type: string
                description: 'Расшифровка HTTP статус-кода'
              timestamp:
                type: string
                format: date-time
                description: 'Дата и время запроса'
          example:
            title: unauthorized
            detail: 'token problem; token is malformed: could not base64 decode signature: illegal base64 data at input byte 84'
            code: '07e4668e--a53a3d31f8b0-[UK-oWaVDUqNrKG]; 03bce=277; 84bd353bf-75'
            requestId: 7b80742415072fe8b6b7f7761f1d1211
            origin: s2s-api-auth-catalog
            status: 401
            statusText: Unauthorized
            timestamp: '2024-09-30T06:52:38Z'
    402:
      description: 'Требуется платёж'
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              title:
                type: string
                description: 'Заголовок ошибки'
              detail:
                type: string
                description: 'Детали ошибки. Ошибка означает, что на балансе сервиса из [Каталога](https://dev.wildberries.ru/business-solutions) недостаточно средств'
          example:
            title: 'payment required'
            detail: 'please top up your balance in your company personal account https://dev.{{ .baseDomain }}/company'
    429:
      description: 'Слишком много запросов'
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              title:
                type: string
                description: 'Заголовок ошибки'
              detail:
                type: string
                description: 'Детали ошибки'
              code:
                type: string
                description: 'Внутренний код ошибки'
              requestId:
                type: string
                description: 'Уникальный ID запроса'
              origin:
                type: string
                description: 'ID внутреннего сервиса WB'
              status:
                type: number
                description: 'HTTP статус-код'
              statusText:
                type: string
                description: 'Расшифровка HTTP статус-кода'
              timestamp:
                type: string
                format: date-time
                description: 'Дата и время запроса'
          example:
            title: 'too many requests'
            detail: 'limited by c122a060-a7fb-4bb4-abb0-32fd4e18d489'
            code: '07e4668e-ac2242c5c8c5-[UK-4dx7JUdskGZ]'
            requestId: 9d3c02cc698f8b041c661a7c28bed293
            origin: s2s-api-auth-catalog
            status: 429
            statusText: 'Too Many Requests'
            timestamp: '2024-09-30T06:52:38Z'
